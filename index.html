<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сессия: ООП, .NET и миграция данных — тренажёр</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--text:#e8eaf0;--mute:#9aa1b1;--acc:#6c8cff;--ok:#2fbf71;--bad:#ef5350;--warn:#f0b429}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 90px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:360px;width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60}
h1{font-size:22px;margin:6px 0 2px}
h2{font-size:18px;margin:18px 0 10px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:.15s}
.mode:hover{border-color:var(--acc)}
.mode b{display:block;font-size:16px;margin-bottom:3px}
.mode span{color:var(--mute);font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
label.sw:last-child{border-bottom:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
input[type=number],input[type=search],select{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
.btn{background:var(--acc);border:0;border-radius:12px;padding:12px 16px;font-weight:600;color:#fff}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:.2s}
.qnum{color:var(--mute);font-size:13px}
.qtext{font-size:17px;font-weight:600;margin:6px 0 10px}
pre{background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font:13.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe3ff;margin:8px 0 12px;white-space:pre}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;align-items:flex-start}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--acc)}.opt.sel .l{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:rgba(47,191,113,.1)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:rgba(239,83,80,.1)}.opt.bad .l{background:var(--bad);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.nav .btn{flex:1}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.dot{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:6px 0;font-size:13px;text-align:center}
.dot.ans{background:#2a3350;border-color:var(--acc)}
.dot.ok{background:rgba(47,191,113,.25);border-color:var(--ok)}
.dot.bad{background:rgba(239,83,80,.25);border-color:var(--bad)}
.dot.cur{outline:2px solid var(--text)}
.dot.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.big{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
.center{text-align:center}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mute);margin-right:4px}
.ans-ok{color:var(--ok);font-weight:600}
.ans-bad{color:var(--bad)}
.hidden{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qa{border-bottom:1px solid var(--line);padding:12px 0}
.qa:last-child{border-bottom:0}
.qa .opts div{font-size:14px;color:var(--mute);padding:2px 0}
.qa .opts div.c{color:var(--ok);font-weight:600}
.timer{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.flagbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;color:var(--mute)}
.flagbtn.on{color:var(--warn);border-color:var(--warn)}
mark{background:#5b4a12;color:#fff;border-radius:3px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q = [{"n": 1, "q": "Что является ключевой концепцией парадигмы объектно-ориентированного программирования?", "code": "", "o": ["Использование только глобальных переменных и процедур", "Последовательное выполнение функций сверху вниз без хранения состояния", "Представление программы как набора взаимодействующих объектов, объединяющих данные и поведение", "Запись программы исключительно в виде математических формул"], "a": 2}, {"n": 2, "q": "Что выведет данный код на C# при вызове метода?", "code": "class Person\n{\n    public string Name = \"Alex\";\n}\nPerson p = new Person();\nConsole.Write(p.Name);", "o": ["Ошибка компиляции", "Alex", "null", "Name"], "a": 1}, {"n": 3, "q": "Какой модификатор доступа делает элемент класса доступным ТОЛЬКО внутри этого же класса?", "code": "", "o": ["public", "protected", "private", "internal"], "a": 2}, {"n": 4, "q": "Какую роль выполняет конструктор класса в C#?", "code": "", "o": ["Инициализирует новый объект при его создании", "Объявляет статические методы класса", "Удаляет объект из памяти", "Запрещает создание экземпляров класса"], "a": 0}, {"n": 5, "q": "Что выведет следующий фрагмент кода на C#?", "code": "class Car\n{\n    public int Speed;\n    public Car(int speed)\n    {\n        Speed = speed;\n    }\n}\nCar c = new Car(100);\nConsole.Write(c.Speed);", "o": ["Ошибка компиляции", "0", "100", "speed"], "a": 2}, {"n": 6, "q": "Что понимается под инкапсуляцией в ООП?", "code": "", "o": ["Разделение программы на несколько файлов", "Возможность объекта принимать разные формы", "Сокрытие внутреннего состояния объекта и доступ к нему только через публичные методы/свойства", "Возможность создавать класс на основе другого класса"], "a": 2}, {"n": 7, "q": "Какой модификатор доступа в C# разрешает доступ к члену класса в пределах текущей сборки (.dll/.exe)?", "code": "", "o": ["sealed", "private", "protected", "internal"], "a": 3}, {"n": 8, "q": "Что выведет данный код при попытке обращения к приватной переменной?", "code": "class Account\n{\n    private int balance = 500;\n}\nAccount acc = new Account();\nConsole.Write(acc.balance);", "o": ["Ошибка компиляции: член balance недоступен из-за уровня защиты", "500", "0", "null"], "a": 0}, {"n": 9, "q": "Для чего в C# используются автосвойства (Auto-Properties)?", "code": "", "o": ["Для запрета изменения значения поля", "Для краткого объявления свойства, у которого компилятор сам создаёт скрытое поле", "Для автоматического создания конструктора", "Для автоматической сериализации класса в JSON"], "a": 1}, {"n": 10, "q": "Что выведет фрагмент кода на C# с использованием свойства с логикой?", "code": "class User\n{\n    private int _age;\n    public int Age\n    {\n        get => _age;\n        set => _age = value < 0 ? 0 : value;\n    }\n}\nUser u = new User();\nu.Age = -15;\nConsole.Write(u.Age);", "o": ["15", "-15", "0", "Ошибка компиляции"], "a": 2}, {"n": 11, "q": "Какое ключевое слово в C# используется для наследования одного класса от другого?", "code": "", "o": ["extends", "inherits", "Двоеточие «:» после имени класса", "implements"], "a": 2}, {"n": 12, "q": "Что выведет этот код при вызове унаследованного метода?", "code": "class Animal\n{\n    public void Eat() => Console.Write(\"Food\");\n}\nclass Dog : Animal { }\nDog d = new Dog();\nd.Eat();", "o": ["Ошибка компиляции", "Ничего не выведет", "Dog", "Food"], "a": 3}, {"n": 13, "q": "Какое ключевое слово в C# используется в базовом классе, чтобы разрешить дочернему классу переопределить метод?", "code": "", "o": ["sealed", "virtual", "override", "new"], "a": 1}, {"n": 14, "q": "Какое ключевое слово используется в дочернем классе C# для переопределения виртуального метода базового класса?", "code": "", "o": ["base", "virtual", "override", "static"], "a": 2}, {"n": 15, "q": "Что выведет следующий фрагмент кода с полиморфизмом?", "code": "class Printer\n{\n    public virtual void Print() => Console.Write(\"Base\");\n}\nclass ColorPrinter : Printer\n{\n    public override void Print() => Console.Write(\"Color\");\n}\nPrinter p = new ColorPrinter();\np.Print();", "o": ["Ошибка компиляции", "Color", "BaseColor", "Base"], "a": 1}, {"n": 16, "q": "Что выведет данный код при обращении к базовому классу через ключевое слово base?", "code": "class Parent\n{\n    public virtual void Greet() => Console.Write(\"Hi\");\n}\nclass Child : Parent\n{\n    public override void Greet()\n    {\n        base.Greet();\n        Console.Write(\"!\");\n    }\n}\nChild c = new Child();\nc.Greet();", "o": ["!Hi", "Hi!", "!", "Hi"], "a": 1}, {"n": 17, "q": "Какое ключевое слово запрещает дальнейшее наследование от данного класса в C#?", "code": "", "o": ["readonly", "const", "static", "sealed"], "a": 3}, {"n": 18, "q": "Какая ошибка произойдет при попытке унаследоваться от класса с модификатором sealed?", "code": "sealed class FinalClass { }\nclass SubClass : FinalClass { }", "o": ["Ошибка во время выполнения InvalidOperationException", "Предупреждение, но программа скомпилируется", "Ошибка компиляции CS0509: нельзя наследовать от запечатанного (sealed) класса", "Ошибок не будет"], "a": 2}, {"n": 19, "q": "Что такое абстрактный класс в C#?", "code": "", "o": ["Класс, все члены которого статические", "Класс, который содержит только поля без методов", "Класс, экземпляр которого нельзя создать; служит базой и может содержать абстрактные методы без реализации", "Класс, от которого запрещено наследоваться"], "a": 2}, {"n": 20, "q": "Что выведет следующий фрагмент кода с абстрактным классом?", "code": "abstract class Appliance\n{\n    public abstract void TurnOn();\n}\nclass Lamp : Appliance\n{\n    public override void TurnOn() => Console.Write(\"Light\");\n}\nAppliance a = new Lamp();\na.TurnOn();", "o": ["Light", "Ошибка компиляции: нельзя создать абстрактный класс", "Ничего не выведет", "TurnOn"], "a": 0}, {"n": 21, "q": "Что представляет собой интерфейс (interface) в C#?", "code": "", "o": ["Класс, от которого можно создать объект", "Контракт — набор членов, которые обязан реализовать класс, без хранения состояния", "Специальный тип для хранения чисел", "Графический элемент пользовательского интерфейса"], "a": 1}, {"n": 22, "q": "Какое ключевое слово используется для реализации интерфейса классом в C#?", "code": "", "o": ["interface", "uses", "implements", "Двоеточие «:» (как и при наследовании)"], "a": 3}, {"n": 23, "q": "Сколько интерфейсов может одновременно реализовать один класс в C#?", "code": "", "o": ["Любое количество", "Не более пяти", "Только один", "Не более двух"], "a": 0}, {"n": 24, "q": "Что выведет код при явной реализации интерфейса в C#?", "code": "interface IRunner\n{\n    void Run();\n}\nclass Athlete : IRunner\n{\n    void IRunner.Run() => Console.Write(\"Running\");\n}\nIRunner r = new Athlete();\nr.Run();", "o": ["Ничего не выведет", "Ошибка компиляции", "Running", "Run"], "a": 2}, {"n": 25, "q": "Какое ключевое слово в C# позволяет создать статический метод или класс, доступный без создания объекта?", "code": "", "o": ["static", "virtual", "sealed", "const"], "a": 0}, {"n": 26, "q": "Что выведет следующий фрагмент кода со статическим свойством?", "code": "class Counter\n{\n    public static int Count = 0;\n    public Counter()\n    {\n        Count++;\n    }\n}\nnew Counter();\nnew Counter();\nConsole.Write(Counter.Count);", "o": ["0", "2", "Ошибка компиляции", "1"], "a": 1}, {"n": 27, "q": "В чем главное различие между типом значения (struct) и ссылочным типом (class) в C#?", "code": "", "o": ["class нельзя передать в метод", "Никакой разницы нет", "struct может наследоваться, а class — нет", "struct хранит само значение и копируется при присваивании, class хранит ссылку на объект в куче"], "a": 3}, {"n": 28, "q": "Что выведет следующий фрагмент кода при передаче структуры в метод?", "code": "struct Point\n{\n    public int X;\n}\nstatic void Change(Point p)\n{\n    p.X = 100;\n}\nPoint pt = new Point { X = 10 };\nChange(pt);\nConsole.Write(pt.X);", "o": ["100", "Ошибка компиляции", "110", "10"], "a": 3}, {"n": 29, "q": "Что выведет аналогичный фрагмент кода при передаче КЛАССА в метод?", "code": "class PointClass\n{\n    public int X;\n}\nstatic void Change(PointClass p)\n{\n    p.X = 100;\n}\nPointClass pt = new PointClass { X = 10 };\nChange(pt);\nConsole.Write(pt.X);", "o": ["Ошибка компиляции", "100", "10", "110"], "a": 1}, {"n": 30, "q": "Для чего в C# 9.0+ используются типы записей (record)?", "code": "", "o": ["Для неизменяемых объектов данных со сравнением по значению", "Для записи данных в файл", "Для создания статических классов", "Для логирования ошибок"], "a": 0}, {"n": 31, "q": "Что выведет данный фрагмент C# кода при сравнении двух записей (record)?", "code": "public record Item(string Name, int Price);\nItem i1 = new Item(\"Pen\", 10);\nItem i2 = new Item(\"Pen\", 10);\nConsole.Write(i1 == i2);", "o": ["Pen10", "False", "True", "Ошибка компиляции"], "a": 2}, {"n": 32, "q": "Какое ключевое слово позволяет передать параметр в метод по ссылке (by reference) с возможностью его изменения?", "code": "", "o": ["in", "params", "var", "ref"], "a": 3}, {"n": 33, "q": "Что выведет данный код с использованием модификатора ref?", "code": "static void Modify(ref int n) => n += 5;\nint num = 10;\nModify(ref num);\nConsole.Write(num);", "o": ["15", "5", "10", "Ошибка компиляции"], "a": 0}, {"n": 34, "q": "В чем отличие модификатора out от ref в C#?", "code": "", "o": ["out не требует инициализации переменной до вызова, но метод обязан присвоить ей значение", "out передаёт параметр по значению, ref — по ссылке", "Отличий нет", "ref используется только для строк"], "a": 0}, {"n": 35, "q": "Что выведет следующий фрагмент кода с ключевым словом this?", "code": "class Box\n{\n    private int w;\n    public Box(int w)\n    {\n        this.w = w;\n    }\n    public int GetW() => w;\n}\nBox b = new Box(42);\nConsole.Write(b.GetW());", "o": ["w", "42", "0", "Ошибка компиляции"], "a": 1}, {"n": 36, "q": "Что произойдет при вызове деструктора (~ClassName()) в C#?", "code": "", "o": ["Возникает ошибка компиляции при любом объявлении деструктора", "Создаётся копия объекта", "Объект удаляется сразу в момент вызова программистом", "Его вызывает сборщик мусора автоматически перед уничтожением объекта; вызвать явно нельзя"], "a": 3}, {"n": 37, "q": "Что произойдет, если в классе объявлено несколько методов с одинаковым именем, но разными типами/количеством параметров?", "code": "", "o": ["Переопределение методов (override)", "Перегрузка методов — компилятор выберет нужный по параметрам", "Будет вызываться всегда последний объявленный метод", "Ошибка компиляции: имена методов должны быть уникальны"], "a": 1}, {"n": 38, "q": "Что выведет следующий перегруженный метод?", "code": "class Calc\n{\n    public int Add(int a, int b) => a + b;\n    public string Add(string a, string b) => a + b;\n}\nCalc c = new Calc();\nConsole.Write(c.Add(\"1\", \"2\"));", "o": ["12", "1 2", "3", "Ошибка компиляции"], "a": 0}, {"n": 39, "q": "Что означает аббревиатура SOLID в проектировании программного обеспечения?", "code": "", "o": ["Пять принципов ООП-проектирования: SRP, OCP, LSP, ISP, DIP", "Набор паттернов для работы с потоками", "Язык запросов к базе данных", "Стандарт оформления кода C#"], "a": 0}, {"n": 40, "q": "В чем заключается принцип единой ответственности (Single Responsibility Principle — SRP)?", "code": "", "o": ["В программе должен быть только один класс", "Класс должен иметь только один метод", "Класс должен иметь только один экземпляр", "У класса должна быть только одна причина для изменения (одна ответственность)"], "a": 3}, {"n": 41, "q": "Какая проблема возникает, если класс нарушает принцип SRP (является God Object / Божественным объектом)?", "code": "", "o": ["Класс становится огромным, сильно связанным, его сложно изменять и тестировать", "Программа начинает работать быстрее", "Уменьшается объём памяти", "Класс невозможно скомпилировать"], "a": 0}, {"n": 42, "q": "В чем заключается принцип открытости/закрытости (Open/Closed Principle — OCP)?", "c какой проблемы нет", "Всегда возникает ошибка компиляции", "Переполнение: значение выходит за диапазон int и результат становится некорректным", "Число автоматически станет long"], "a": 2}, {"n": 140, "q": "Для чего в процедурах миграции больших объемов данных применяются пакетная обработка (Batch Processing)?", "code": "", "o": ["Чтобы обрабатывать всё одной транзакцией в памяти", "Чтобы данные удалялись быстрее", "Чтобы обрабатывать данные частями — снижая нагрузку на память и упрощая восстановление при сбое", "Чтобы не делать проверку данных"], "a": 2}, {"n": 141, "q": "Что выведет следующий фрагмент C# кода, использующий Convert.ToInt32(null)?", "code": "int val = Convert.ToInt32(null);\nConsole.Write(val);", "o": ["0", "ArgumentNullException", "Ошибка компиляции", "null"], "a": 0}, {"n": 142, "q": "В чем главное отличие поведения Convert.ToInt32(null) от int.Parse(null)?", "code": "", "o": ["int.Parse(null) возвращает 0, а Convert — исключение", "Оба выбрасывают исключение", "Оба возвращают 0", "Convert.ToInt32(null) возвращает 0, а int.Parse(null) выбрасывает ArgumentNullException"], "a": 3}, {"n": 143, "q": "Что выведет фрагмент C# кода с преобразованием объекта в булево значение Convert.ToBoolean(1)?", "code": "bool flag = Convert.ToBoolean(1);\nConsole.Write(flag);", "o": ["InvalidCastException", "False", "1", "True"], "a": 3}, {"n": 144, "q": "Для чего в миграционных скриптах создаются протоколы конвертации (Migration Audit Logs)?", "code": "", "o": ["Для хранения паролей пользователей", "Для фиксации хода миграции, ошибок и изменений — для контроля и аудита", "Для удаления данных", "Для ускорения миграции"], "a": 1}, {"n": 145, "q": "Что выведет данный код при попытке явного приведения с проверкой через оператор is (Pattern Matching)?", "code": "object input = 100;\nif (input is int number)\n{\n    Console.Write(number + 50);\n}", "o": ["150", "Ничего не выведет", "100", "10050"], "a": 0}, {"n": 146, "q": "Что выведет следующая проверка типов перед выполнением конвертации?", "code": "object val = \"123\";\nConsole.Write(val is string);", "o": ["True", "Ошибка компиляции", "123", "False"], "a": 0}, {"n": 147, "q": "Для чего при миграции данных между несопоставимыми системами применяются промежуточные схемы (Staging Area / БД промежуточного хранения)?", "code": "", "o": ["Для хранения логов сервера", "Для промежуточной загрузки, очистки и преобразования данных перед переносом в целевую систему", "Для резервного копирования кода", "Для окончательного хранения данных"], "a": 1}, {"n": 148, "q": "Какая стратегия обработки ошибок рекомендуется при обнаружении поврежденной записи в процессе массовой миграции?", "code": "", "o": ["Игнорировать ошибку без записи", "Перезагрузить сервер", "Записать ошибку в лог, пропустить/отложить запись и продолжить обработку остальных", "Остановить всю миграцию и удалить все данные"], "a": 2}, {"n": 149, "q": "Что выведет следующий фрагмент C# кода при конвертации массива байт в строку и обратно с использованием System.Text.Encoding?", "code": "string original = \"Data\";\nbyte[] bytes = System.Text.Encoding.UTF8.GetBytes(original);\nstring restored = System.Text.Encoding.UTF8.GetString(bytes);\nConsole.Write(restored == original);", "o": ["Ошибка компиляции", "True", "False", "Data"], "a": 1}, {"n": 150, "q": "Какое главное правило транзакционности (Atomicity) должно соблюдаться при выполнении процедуры миграции данных?", "code": "", "o": ["Транзакции не используются", "Миграция выполняется по принципу «всё или ничего»: при ошибке все изменения откатываются", "Данные переносятся частично, ошибки игнорируются", "Каждая запись сохраняется без проверки"], "a": 1}];
const TOPICS=[
 {id:'oop',name:'ООП в C#',from:1,to:38},
 {id:'sol',name:'SOLID, паттерны, исключения',from:39,to:76},
 {id:'net',name:'Сборка и .NET',from:77,to:113},
 {id:'mig',name:'Конвертация и миграция',from:114,to:150}];
const L=['A','B','C','D'];
const $=s=>document.querySelector(s);
const app=$('#app');
const store={get(k,d){try{const v=localStorage.getItem('sess_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('sess_'+k,JSON.stringify(v))}catch(e){}}};
let settings=Object.assign({shuffleQ:true,shuffleO:false,instant:true,timer:false},store.get('settings',{}));
let T=null; // current test
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const topicOf=n=>TOPICS.find(t=>n>=t.from&&n<=t.to);
const wrongSet=()=>new Set(store.get('wrong',[]));
const known=()=>store.get('known',{}); // n -> streak correct

function home(){
  stopTimer();T=null;
  const hist=store.get('hist',[]);const w=wrongSet();const k=known();
  const learned=Object.values(k).filter(v=>v>=2).length;
  const best=hist.length?Math.max(...hist.map(h=>h.p)):0;
  app.innerHTML=`
  <h1>Подготовка к сессии</h1>
  <div class="sub">150 вопросов · ООП, SOLID, сборка .NET, миграция данных</div>
  <div class="card stats">
    <div class="stat"><b>${hist.length}</b><span>тестов пройдено</span></div>
    <div class="stat"><b>${best}%</b><span>лучший результат</span></div>
    <div class="stat"><b>${learned}/150</b><span>выучено</span></div>
    <div class="stat"><b>${w.size}</b><span>ошибок</span></div>
  </div>
  <h2>Режимы</h2>
  <div class="grid">
    <button class="mode" onclick="start(pick(150,'all'),'Полный тест')"><b>📝 Полный тест</b><span>Все 150 вопросов</span></button>
    <button class="mode" onclick="start(pick(30,'all'),'Случайные 30')"><b>🎲 Случайные 30</b><span>Как на настоящем экзамене</span></button>
    <button class="mode" onclick="startWrong()"><b>🔁 Работа над ошибками</b><span>${w.size?w.size+' вопр., где ты ошибся':'Пока ошибок нет'}</span></button>
    <button class="mode" onclick="startNew()"><b>🧠 Невыученные</b><span>Ещё не отвечены верно 2 раза подряд</span></button>
    <button class="mode" onclick="custom()"><b>⚙️ Свой тест</b><span>Тема, диапазон номеров, количество</span></button>
    <button class="mode" onclick="review()"><b>📖 Все ответы</b><span>Шпаргалка с поиском</span></button>
  </div>
  <h2>Настройки</h2>
  <div class="card">
    <label class="sw">Показывать правильный ответ сразу<input type="checkbox" ${settings.instant?'checked':''} onchange="setS('instant',this.checked)"></label>
    <label class="sw">Перемешивать вопросы<input type="checkbox" ${settings.shuffleQ?'checked':''} onchange="setS('shuffleQ',this.checked)"></label>
    <label class="sw">Перемешивать варианты A/B/C/D<input type="checkbox" ${settings.shuffleO?'checked':''} onchange="setS('shuffleO',this.checked)"></label>
    <label class="sw">Таймер (1 мин на вопрос)<input type="checkbox" ${settings.timer?'checked':''} onchange="setS('timer',this.checked)"></label>
  </div>
  ${hist.length?`<h2>История</h2><div class="card">${hist.slice(-8).reverse().map(h=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(h.t)} · ${h.c}/${h.n}</span><b style="color:${h.p>=70?'var(--ok)':h.p>=50?'var(--warn)':'var(--bad)'}">${h.p}%</b></div>`).join('')}
  <button class="btn ghost" style="margin-top:10px;width:100%" onclick="ask('Сбросить весь прогресс?',()=>{['hist','wrong','known'].forEach(k=>store.set(k,k==='known'?{}:[]));home()})">Сбросить прогресс</button></div>`:''}
  `;
  scrollTo(0,0);
}
function setS(k,v){settings[k]=v;store.set('settings',settings)}
function pick(n,topic,from=1,to=150){
  let pool=Q.filter(q=>q.n>=from&&q.n<=to);
  if(topic&&topic!=='all'){const t=TOPICS.find(x=>x.id===topic);pool=pool.filter(q=>q.n>=t.from&&q.n<=t.to)}
  if(n<pool.length||settings.shuffleQ) pool=shuffle(pool);
  pool=pool.slice(0,n);
  if(!settings.shuffleQ) pool.sort((a,b)=>a.n-b.n);
  return pool;
}
function startWrong(){const w=wrongSet();if(!w.size){toast('Ошибок пока нет — пройди любой тест.');return}start(shuffle(Q.filter(q=>w.has(q.n))),'Работа над ошибками')}
function startNew(){const k=known();const p=Q.filter(q=>(k[q.n]||0)<2);if(!p.length){toast('Все вопросы выучены! 🎉');return}start(shuffle(p).slice(0,30),'Невыученные')}

function start(list,title){
  T={title,items:list.map(q=>{const order=settings.shuffleO?shuffle([0,1,2,3]):[0,1,2,3];return{q,order,pick:null,flag:false}}),i:0,done:false,instant:settings.instant,t0:Date.now(),limit:settings.timer?list.length*60:0};
  if(T.limit)startTimer();
  render();
}
let timerId=null;
function startTimer(){stopTimer();timerId=setInterval(()=>{const el=$('#tm');const left=T.limit-((Date.now()-T.t0)/1000|0);if(left<=0){stopTimer();finish(true);return}if(el)el.textContent='⏱ '+fmtT(left)},1000)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
const fmtT=s=>`${s/60|0}:${String(s%60).padStart(2,'0')}`;

function render(){
  const it=T.items[T.i],q=it.q,answered=T.items.filter(x=>x.pick!==null).length;
  const show=T.instant&&it.pick!==null;
  app.innerHTML=`
  <div class="top">
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" style="padding:6px 12px" onclick="ask('Выйти из теста? Прогресс теста не сохранится.',home)">✕</button>
      <b>${T.i+1} / ${T.items.length}</b>
      <span class="timer" id="tm">${T.limit?'⏱ '+fmtT(Math.max(0,T.limit-((Date.now()-T.t0)/1000|0))):''}</span>
      <button class="btn ghost" style="padding:6px 12px" onclick="toggleGrid()">☰</button>
    </div>
    <div class="bar"><i style="width:${answered/T.items.length*100}%"></i></div>
  </div>
  <div id="gridbox" class="card hidden"><div class="dots">${T.items.map((x,j)=>{let c='dot';if(x.pick!==null)c+=T.instant?(x.order[x.pick]===x.q.a?' ok':' bad'):' ans';if(j===T.i)c+=' cur';if(x.flag)c+=' flag';return`<button class="${c}" onclick="go(${j})">${j+1}</button>`}).join('')}</div>
   <div class="sub" style="margin-top:8px">Отвечено: ${answered} из ${T.items.length}</div></div>
  <div class="row" style="justify-content:space-between"><span class="qnum">Вопрос №${q.n} · <span class="tag">${topicOf(q.n).name}</span></span>
   <button class="flagbtn ${it.flag?'on':''}" onclick="T.items[T.i].flag=!T.items[T.i].flag;render()">⚑ ${it.flag?'отмечен':'отметить'}</button></div>
  <div class="qtext">${esc(q.q)}</div>
  ${q.code?`<pre>${esc(q.code)}</pre>`:''}
  <div>${it.order.map((oi,k)=>{let c='opt';if(show){if(oi===q.a)c+=' ok';else if(k===it.pick)c+=' bad'}else if(k===it.pick)c+=' sel';
    return`<button class="${c}" onclick="answer(${k})" ${show?'disabled':''}><span class="l">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`}).join('')}</div>
  ${show?`<div class="card ${it.order[it.pick]===q.a?'ans-ok':'ans-bad'}">${it.order[it.pick]===q.a?'✅ Верно!':'❌ Неверно. Правильный ответ: '+L[it.order.indexOf(q.a)]+') '+esc(q.o[q.a])}</div>`:''}
  <div class="nav"><div class="in">
    <button class="btn sec" onclick="go(T.i-1)" ${T.i===0?'disabled':''}>← Назад</button>
    ${T.i<T.items.length-1?`<button class="btn" onclick="go(T.i+1)">Далее →</button>`:`<button class="btn" onclick="finish()">Завершить</button>`}
  </div></div>`;
}
function toggleGrid(){$('#gridbox').classList.toggle('hidden')}
function go(j){if(j<0||j>=T.items.length)return;T.i=j;render();scrollTo(0,0)}
function answer(k){
  const it=T.items[T.i];if(T.instant&&it.pick!==null)return;
  it.pick=k;
  if(T.instant){record(it);render()}
  else{render();setTimeout(()=>{if(T&&T.i<T.items.length-1&&T.items[T.i]===it)go(T.i+1)},250)}
}
function record(it){
  const ok=it.order[it.pick]===it.q.a,w=wrongSet(),k=known();
  if(ok){k[it.q.n]=(k[it.q.n]||0)+1;if(k[it.q.n]>=2)w.delete(it.q.n)}else{k[it.q.n]=0;w.add(it.q.n)}
  store.set('wrong',[...w]);store.set('known',k);
}
document.addEventListener('keydown',e=>{if(!T||T.done)return;const m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3,'ф':0,'и':1,'с':2,'в':3}[e.key.toLowerCase()];
  if(m!==undefined)answer(m);else if(e.key==='ArrowRight')go(T.i+1);else if(e.key==='ArrowLeft')go(T.i-1)});

function finish(timeout,force){
  const un=T.items.filter(x=>x.pick===null).length;
  if(!timeout&&un&&!force){ask(`Без ответа: ${un}. Всё равно завершить?`,()=>finish(false,true));return}
  stopTimer();T.done=true;
  if(!T.instant)T.items.forEach(it=>{if(it.pick!==null)record(it)});
  const c=T.items.filter(x=>x.pick!==null&&x.order[x.pick]===x.q.a).length,n=T.items.length,p=Math.round(c/n*100);
  const hist=store.get('hist',[]);hist.push({t:T.title,c,n,p,d:Date.now()});store.set('hist',hist.slice(-50));
  const bad=T.items.filter(x=>x.pick===null||x.order[x.pick]!==x.q.a);
  const grade=p>=90?'Отлично 🔥':p>=75?'Хорошо 👍':p>=50?'Удовлетворительно':'Нужно повторить';
  const secs=(Date.now()-T.t0)/1000|0;
  app.innerHTML=`
   <h1>${esc(T.title)} — результат</h1>
   ${timeout?'<div class="card ans-bad">⏱ Время вышло</div>':''}
   <div class="card center"><div class="big" style="color:${p>=75?'var(--ok)':p>=50?'var(--warn)':'var(--bad)'}">${p}%</div>
    <div>${c} из ${n} верно · ${grade}</div><div class="sub">Время: ${fmtT(secs)}</div></div>
   <div class="grid">
    ${bad.length?`<button class="btn" onclick="start(shuffle(T.items.filter(x=>x.pick===null||x.order[x.pick]!==x.q.a).map(x=>x.q)),'Повтор ошибок')">🔁 Повторить ошибки (${bad.length})</button>`:''}
    <button class="btn sec" onclick="home()">🏠 На главную</button>
   </div>
   ${bad.length?`<h2>Ошибки и пропуски</h2><div class="card">${bad.map(x=>`<div class="qa"><div class="qnum">№${x.q.n}</div><div style="font-weight:600">${esc(x.q.q)}</div>${x.q.code?`<pre>${esc(x.q.code)}</pre>`:''}
     ${x.pick!==null?`<div class="ans-bad">Твой ответ: ${esc(x.q.o[x.order[x.pick]])}</div>`:'<div class="ans-bad">Без ответа</div>'}
     <div class="ans-ok">Правильно: ${esc(x.q.o[x.q.a])}</div></div>`).join('')}</div>`:'<div class="card center">Без единой ошибки! 🎉</div>'}`;
  scrollTo(0,0);
}

function custom(){
  app.innerHTML=`<div class="row"><button class="btn ghost" style="padding:6px 12px" onclick="home()">←</button><h1 style="margin:0">Свой тест</h1></div>
  <div class="card">
   <div class="sub">Тема</div>
   <select id="ct"><option value="all">Все темы</option>${TOPICS.map(t=>`<option value="${t.id}">${t.name} (${t.from}–${t.to})</option>`).join('')}</select>
   <div class="row" style="margin-top:12px"><div style="flex:1"><div class="sub">С номера</div><input type="number" id="cf" value="1" min="1" max="150"></div>
   <div style="flex:1"><div class="sub">По номер</div><input type="number" id="cto" value="150" min="1" max="150"></div></div>
   <div class="sub" style="margin-top:12px">Количество вопросов</div>
   <div class="chips">${[10,20,30,50,'все'].map(v=>`<button class="chip ${v===20?'on':''}" onclick="document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');$('#cn').value='${v==='все'?999:v}'">${v}</button>`).join('')}</div>
   <input type="number" id="cn" value="20" min="1" max="150">
   <button class="btn" style="width:100%;margin-top:14px" onclick="goCustom()">Начать</button>
  </div>`;
}
function goCustom(){
  const f=Math.max(1,+$('#cf').value||1),to=Math.min(150,+$('#cto').value||150),n=Math.max(1,+$('#cn').value||20);
  const l=pick(n,$('#ct').value,Math.min(f,to),Math.max(f,to));
  if(!l.length){toast('Нет вопросов под эти условия');return}
  start(l,'Свой тест');
}

let rvTopic='all',rvOnlyWrong=false;
function review(){
  app.innerHTML=`<div class="top"><div class="row"><button class="btn ghost" style="padding:6px 12px" onclick="home()">←</button><h1 style="margin:0">Все ответы</h1></div>
   <input type="search" id="rs" placeholder="Поиск по вопросу, коду или ответу…" style="margin-top:10px" oninput="drawReview()">
   <div class="chips"><button class="chip" data-t="all">Все</button>${TOPICS.map(t=>`<button class="chip" data-t="${t.id}">${t.name}</button>`).join('')}<button class="chip" id="ow">Только мои ошибки</button></div>
   <label class="sw" style="border:0;padding:2px 0"><span class="sub">Скрывать ответы (режим самопроверки)</span><input type="checkbox" id="hideA" onchange="drawReview()"></label></div>
  <div id="rl"></div>`;
  document.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{rvTopic=c.dataset.t;drawReview()});
  $('#ow').onclick=()=>{rvOnlyWrong=!rvOnlyWrong;drawReview()};
  drawReview();
}
function drawReview(){
  document.querySelectorAll('.chip[data-t]').forEach(c=>c.classList.toggle('on',c.dataset.t===rvTopic));
  $('#ow').classList.toggle('on',rvOnlyWrong);
  const s=$('#rs').value.trim().toLowerCase(),hide=$('#hideA').checked,w=wrongSet();
  let list=Q;
  if(rvTopic!=='all'){const t=TOPICS.find(x=>x.id===rvTopic);list=list.filter(q=>q.n>=t.from&&q.n<=t.to)}
  if(rvOnlyWrong)list=list.filter(q=>w.has(q.n));
  if(s)list=list.filter(q=>(q.n+' '+q.q+' '+q.code+' '+q.o.join(' ')).toLowerCase().includes(s));
  const hl=t=>{t=esc(t);if(!s)return t;const i=t.toLowerCase().indexOf(esc(s));return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(s).length)+'</mark>'+t.slice(i+esc(s).length)};
  $('#rl').innerHTML=`<div class="sub">Найдено: ${list.length}</div><div class="card">${list.map(q=>`<div class="qa"><div class="qnum">№${q.n}${w.has(q.n)?' · <span style="color:var(--bad)">ошибка</span>':''}</div>
   <div style="font-weight:600">${hl(q.q)}</div>${q.code?`<pre>${esc(q.code)}</pre>`:''}
   <div class="opts">${q.o.map((o,i)=>`<div class="${!hide&&i===q.a?'c':''}">${L[i]}) ${hl(o)}${!hide&&i===q.a?' ✓':''}</div>`).join('')}</div>
   ${hide?`<button class="btn ghost" style="padding:4px 10px;font-size:13px;margin-top:6px" onclick="this.outerHTML='<div class=ans-ok>Ответ: ${L[q.a]}) '+${JSON.stringify(esc(q.o[q.a])).replace(/"/g,'&quot;')}+'</div>'">Показать ответ</button>`:''}
  </div>`).join('')||'<div class="sub">Ничего не найдено</div>'}</div>`;
}
function ask(msg,yes){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><div style="margin-bottom:14px">${esc(msg)}</div><div class="row"><button class="btn sec" style="flex:1">Отмена</button><button class="btn" style="flex:1">Да</button></div></div>`;document.body.appendChild(m);const [n,y]=m.querySelectorAll('button');n.onclick=()=>m.remove();y.onclick=()=>{m.remove();yes()};m.onclick=e=>{if(e.target===m)m.remove()}}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
home();
</script>
</body>
</html>
